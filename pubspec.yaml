name: flutter_iot_dashboard
description: "IoT dashboard for ESP32 devices over MQTT and REST"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  mqtt_client: ^10.14.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
